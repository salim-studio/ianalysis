<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1330"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- grid dots -->
  <g fill="#24335f" opacity="0.6">
    <circle cx="80" cy="90" r="2"/><circle cx="130" cy="90" r="2"/><circle cx="180" cy="90" r="2"/>
    <circle cx="1020" cy="540" r="2"/><circle cx="1070" cy="540" r="2"/><circle cx="1120" cy="540" r="2"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(480,120)">
    <rect width="240" height="240" rx="56" fill="url(#acc)"/>
    <circle cx="120" cy="98" r="49" fill="none" stroke="white" stroke-width="13" opacity="0.95"/>
    <line x1="120" y1="147" x2="120" y2="181" stroke="white" stroke-width="17" stroke-linecap="round"/>
    <circle cx="120" cy="191" r="10" fill="white"/>
  </g>

  <!-- title -->
  <text x="600" y="440" text-anchor="middle" font-size="92" font-weight="800" fill="white" letter-spacing="1">ianalysis</text>
  <text x="600" y="492" text-anchor="middle" font-size="34" font-weight="400" fill="#9fb0d8" letter-spacing="6">AI CONTENT DETECTOR</text>

  <!-- pills -->
  <g font-size="24" font-weight="600" fill="#c9d6f5" text-anchor="middle">
    <rect x="300" y="522" width="130" height="48" rx="24" fill="#1a2550" stroke="#24335f"/>
    <text x="365" y="553">Images</text>
    <rect x="442" y="522" width="120" height="48" rx="24" fill="#1a2550" stroke="#24335f"/>
    <text x="502" y="553">Audio</text>
    <rect x="574" y="522" width="120" height="48" rx="24" fill="#1a2550" stroke="#24335f"/>
    <text x="634" y="553">Video</text>
    <rect x="706" y="522" width="110" height="48" rx="24" fill="#1a2550" stroke="#24335f"/>
    <text x="761" y="553">Text</text>
  </g>
</svg>
